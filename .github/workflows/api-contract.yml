name: API contract compatibility

on:
  pull_request:
  push:
    branches: [develop, master, refactor/api-standard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Repository configuration is outside the pull request; never use its local baseline as approval.
      BASELINE_COMMIT: ${{ vars.API_CONTRACT_BASELINE_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Install checksum-pinned oasdiff 1.39.0
        run: python -m scripts.install_oasdiff
      - name: Preserve implementation and documentation consistency checks
        run: python -m scripts.check_api_contract --check-docs --export "$RUNNER_TEMP/openapi-current.json"
      - name: Verify candidate provenance from its source commit (not approval)
        run: python -m scripts.api_baseline --verify
      - name: Run breaking-change regressions and supported-flow smoke tests
        run: python -m pytest -q tests/test_api_compatibility.py tests/test_frontend_api_inventory.py tests/test_deployment_smoke.py
      - name: Retrieve externally configured trusted baseline commit
        run: |
          if [[ ! "$BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Approved API v1 baseline is Pending. Accept the reproducible candidate separately, then set API_CONTRACT_BASELINE_COMMIT to the commit containing approved-v1.json and metadata. No current-PR fallback is permitted.'
            exit 1
          fi
          git fetch --no-tags origin "$BASELINE_COMMIT"
      - name: Reject incompatible changes against the approved baseline
        run: python -m scripts.check_api_compatibility --trusted-ref "$BASELINE_COMMIT" --current "$RUNNER_TEMP/openapi-current.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-current-openapi
          path: ${{ runner.temp }}/openapi-current.json
