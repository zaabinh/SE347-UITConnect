name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build backend image
        run: docker build --tag uitconnect-backend:ci .
      - name: Start image with its default entrypoint
        run: |
          docker run --detach --name uitconnect-backend-ci \
            --publish 127.0.0.1:18000:8000 \
            --env APP_ENV=production \
            --env DATABASE_URL=sqlite+pysqlite:///:memory: \
            --env JWT_SECRET_KEY=ci-only-secret-for-entrypoint-smoke-tests-0123456789 \
            --env FRONTEND_URL=http://localhost:3000 \
            --env CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            uitconnect-backend:ci
      - name: Check backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Show backend logs and stop container
        if: always()
        run: |
          if docker container inspect uitconnect-backend-ci >/dev/null 2>&1; then
            docker stop --time 10 uitconnect-backend-ci
            docker logs uitconnect-backend-ci
            docker rm uitconnect-backend-ci
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
