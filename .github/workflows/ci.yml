name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiMigrationOnly_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiMigrationOnly_2026!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Validate frozen API contract and documentation
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///:memory:
          FRONTEND_URL: http://localhost:3000
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: python -m scripts.check_api_contract --check-docs --export .tmp/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-v1-openapi
          path: backend/.tmp/openapi.json
      - name: Build backend image
        run: docker build --tag uitconnect-backend:ci .
      - name: Verify versioned SQL Server migrations
        run: |
          docker run --rm --network host \
            --env APP_ENV=test \
            --env 'DATABASE_URL=mssql+pyodbc://sa:CiMigrationOnly_2026%21@127.0.0.1:1433/master?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes' \
            --env FRONTEND_URL=http://localhost:3000 \
            --env CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            uitconnect-backend:ci python -m scripts.verify_migrations
      - name: Start image with its default entrypoint
        run: |
          docker run --detach --name uitconnect-backend-ci \
            --publish 127.0.0.1:18000:8000 \
            --env APP_ENV=production \
            --env DATABASE_URL=sqlite+pysqlite:///:memory: \
            --env JWT_SECRET_KEY=ci-only-secret-for-entrypoint-smoke-tests-0123456789 \
            --env FRONTEND_URL=http://localhost:3000 \
            --env CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            uitconnect-backend:ci
      - name: Check backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Show backend logs and stop container
        if: always()
        run: |
          if docker container inspect uitconnect-backend-ci >/dev/null 2>&1; then
            docker stop --time 10 uitconnect-backend-ci
            docker logs uitconnect-backend-ci
            docker rm uitconnect-backend-ci
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: API consumer contract tests
        run: npm run test:contract
      - name: Build
        run: npm run build
