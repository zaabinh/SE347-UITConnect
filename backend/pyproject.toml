[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uitconnect-backend"
version = "1.0.0"
description = "UITConnect student forum API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "alembic>=1.13,<2",
    "pyodbc==5.2.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "python-jose==3.5.0",
    "pydantic[email]==2.11.7",
    "python-dotenv==1.1.1",
    "python-slugify==8.0.4",
    "faker==37.5.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app.db" = ["init/*.sql"]
scripts = ["data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
